<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | JonZorlu</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
        /* Remove default body margins/padding and ensure no scrollbars */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars */
            background: #231F20; /* Match background to canvas */
            /* Optional: Remove text-align: center if you want the canvas truly edge-to-edge */
            /* text-align: left; */
        }

        /* Style the canvas to be full screen */
        #unity-canvas {
            width: 100%;
            height: 100%;
            position: fixed; /* Positions the canvas relative to the viewport */
            top: 0;
            left: 0;
            /* Ensure canvas covers the whole area */
            display: block;
        }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/BuildRun1.loader.js"></script>

    <script>
      // This part remains for mobile-specific meta tag if you still need it,
      // although the one in the head should cover most cases.
      // You can remove this if the head meta tag is sufficient.
      /*
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.body.style.textAlign = "left"; // Moved out if applying globally via CSS
      }
      */

      // Get the canvas element
      var canvas = document.querySelector("#unity-canvas");

      // The original width and height attributes are not strictly necessary if
      // you are controlling size purely with CSS and matchWebGLToCanvasSize is true.
      // But keeping them doesn't hurt.
      // canvas.width = 960; // Original width
      // canvas.height = 600; // Original height

      // The Unity instance creation
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/BuildRun1.data.br",
        frameworkUrl: "Build/BuildRun1.framework.js.br",
        codeUrl: "Build/BuildRun1.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "JonZorlu",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
